services:
  - type: web
    name: nimbus-beaconhouse
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OWNER_EMAILS
        sync: false
      - key: NIMBUS_DAILY_LIMIT
        value: "1500"
